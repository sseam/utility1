plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sseam.android.utility1'

    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    def admob_app_id = properties.getProperty('admob.app.id')

    compileSdkVersion 37
    defaultConfig {
        applicationId "com.sseam.android.utility1"
        minSdkVersion 26
        targetSdkVersion 37
        versionCode 7
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [admob_app_id: admob_app_id]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        releaseTest {
            initWith release                          // Same R8/minify settings as release
            signingConfig signingConfigs.debug        // Local test only
            applicationIdSuffix ".test"               // Installs side by side with the debug build
            matchingFallbacks = ['release']           // Only needed if you have library modules
        }
    }

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-ads:24.5.0'
    implementation 'com.google.gms:google-services:4.4.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}